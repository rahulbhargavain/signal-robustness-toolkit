<svg width="100%" viewBox="0 0 380 730" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Flowchart of walk_forward_validate, updated with purge/embargo</title>
<desc>Input df flows into chronological_split producing train and test frames, then optionally through apply_purge_embargo, each side passed through stat_fn, both results feeding classify_overfitting, marked as a subprocess with its own branching-logic diagram, which produces the final WalkForwardResult. A footnote notes that cpcv_validator.py reuses classify_overfitting across many combinatorial splits instead of one.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="190" y1="96" x2="190" y2="150" marker-end="url(#arrow)" style="stroke:rgb(137,135,129);stroke-width:1.5px"/>
<line x1="190" y1="212" x2="190" y2="266" marker-end="url(#arrow)" style="stroke:rgb(137,135,129);stroke-width:1.5px"/>
<line x1="190" y1="328" x2="105" y2="382" marker-end="url(#arrow)" style="stroke:rgb(137,135,129);stroke-width:1.5px"/>
<line x1="190" y1="328" x2="275" y2="382" marker-end="url(#arrow)" style="stroke:rgb(137,135,129);stroke-width:1.5px"/>
<line x1="105" y1="444" x2="190" y2="498" marker-end="url(#arrow)" style="stroke:rgb(137,135,129);stroke-width:1.5px"/>
<line x1="275" y1="444" x2="190" y2="498" marker-end="url(#arrow)" style="stroke:rgb(137,135,129);stroke-width:1.5px"/>
<line x1="190" y1="560" x2="190" y2="614" marker-end="url(#arrow)" style="stroke:rgb(137,135,129);stroke-width:1.5px"/>

<g font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="90" y="40" width="200" height="56" rx="8" stroke-width="0.5" style="fill:rgb(241,239,232);stroke:rgb(95,94,90)"/>
<text x="190" y="58" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-size:14px;font-weight:500">Input</text>
<text x="190" y="76" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-size:12px">df, date_col, stat_fn</text>

<rect x="90" y="156" width="200" height="56" rx="8" stroke-width="0.5" style="fill:rgb(225,245,238);stroke:rgb(15,110,86)"/>
<text x="190" y="174" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8,80,65);font-size:14px;font-weight:500">chronological_split</text>
<text x="190" y="192" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15,110,86);font-size:12px">sorts by date, splits 70/30</text>

<rect x="90" y="272" width="200" height="56" rx="8" stroke-width="0.5" style="fill:rgb(225,245,238);stroke:rgb(15,110,86)"/>
<text x="190" y="290" text-anchor="middle" dominant-baseline="central" style="fill:rgb(8,80,65);font-size:14px;font-weight:500">apply_purge_embargo</text>
<text x="190" y="308" text-anchor="middle" dominant-baseline="central" style="fill:rgb(15,110,86);font-size:12px">optional, no-op if purge_days=embargo_days=0</text>

<rect x="30" y="388" width="150" height="56" rx="8" stroke-width="0.5" style="fill:rgb(238,237,254);stroke:rgb(83,74,183)"/>
<text x="105" y="406" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,52,137);font-size:14px;font-weight:500">stat_fn(train)</text>
<text x="105" y="424" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83,74,183);font-size:12px">StatResult</text>

<rect x="200" y="388" width="150" height="56" rx="8" stroke-width="0.5" style="fill:rgb(238,237,254);stroke:rgb(83,74,183)"/>
<text x="275" y="406" text-anchor="middle" dominant-baseline="central" style="fill:rgb(60,52,137);font-size:14px;font-weight:500">stat_fn(test)</text>
<text x="275" y="424" text-anchor="middle" dominant-baseline="central" style="fill:rgb(83,74,183);font-size:12px">StatResult</text>

<rect x="90" y="504" width="200" height="56" rx="8" stroke-width="0.5" style="fill:rgb(250,236,231);stroke:rgb(153,60,29)"/>
<line x1="102" y1="504" x2="102" y2="560" stroke="rgb(0,0,0)" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="278" y1="504" x2="278" y2="560" stroke="rgb(0,0,0)" stroke-opacity="0.2" stroke-width="0.5"/>
<text x="190" y="522" text-anchor="middle" dominant-baseline="central" style="fill:rgb(113,43,19);font-size:14px;font-weight:500">classify_overfitting</text>
<text x="190" y="540" text-anchor="middle" dominant-baseline="central" style="fill:rgb(153,60,29);font-size:12px">first matching rule wins</text>

<rect x="90" y="620" width="200" height="56" rx="8" stroke-width="0.5" style="fill:rgb(241,239,232);stroke:rgb(95,94,90)"/>
<text x="190" y="638" text-anchor="middle" dominant-baseline="central" style="fill:rgb(68,68,65);font-size:14px;font-weight:500">WalkForwardResult</text>
<text x="190" y="656" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-size:12px">verdict + reasoning</text>

<text x="190" y="704" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-size:11px">cpcv_validator.py reuses classify_overfitting() across every C(n,k) combinatorial split, not just this one.</text>
</g>
</svg>
