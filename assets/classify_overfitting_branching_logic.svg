<text x="535" y="62" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12,68,124);font-size:14px;font-weight:500">Insufficient edge</text>

<rect x="430" y="150" width="210" height="44" rx="8" stroke-width="0.5" style="fill:rgb(230,241,251);stroke:rgb(24,95,165)"/>
