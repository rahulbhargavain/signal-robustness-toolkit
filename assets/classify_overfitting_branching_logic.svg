<svg width="100%" viewBox="0 0 680 920" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Branching logic of classify_overfitting -- shared by walk_forward_validate and cpcv_validator.py</title>
<desc>Seven guards evaluated top to bottom, first match wins. Train significant (|t| at or above the small-sample Student-t critical value unless a fixed significance_t is given), then test statistic computable (a NaN test statistic exits as INSUFFICIENT_DATA), then sign flipped, then test significant, then retention defined, then retention above 70 percent, then retention above 40 percent, each exiting right to a verdict or falling through down to the next guard, ending in a default weak verdict. This same logic is evaluated once per split by walk_forward_validate() and once per combinatorial path (up to C(n,k) times) by cpcv_validator.cpcv_validate().</desc>
