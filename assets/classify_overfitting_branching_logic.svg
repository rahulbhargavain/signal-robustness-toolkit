<text x="340" y="890" text-anchor="middle" dominant-baseline="central" style="fill:rgb(95,94,90);font-size:11px">Shared: walk_forward_validate() calls this once; cpcv_validator.cpcv_validate() calls it once per combinatorial split (up to C(n,k) times).</text>
