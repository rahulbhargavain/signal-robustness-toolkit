<text x="535" y="380" text-anchor="middle" dominant-baseline="central" style="fill:rgb(99,56,6);font-size:14px;font-weight:500">Overfitted or weak</text>
<text x="535" y="398" text-anchor="middle" dominant-baseline="central" style="fill:rgb(133,79,11);font-size:12px">by retention level</text>

<rect x="430" y="480" width="210" height="44" rx="8" stroke-width="0.5" style="fill:rgb(250,238,218);stroke:rgb(133,79,11)"/>
